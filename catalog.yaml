# CAuDri Regulations Catalog
# 
# This file describes all road section, elements, features and zones than can be present on a CAuDri track.
# It defines all valid object configurations, parameters, constraints and default values.
# Regulatory limits are defined in regulations.yaml and applied through native JSON Schema references.

$schema: https://json-schema.org/draft/2020-12/schema
$id: catalog.yaml

title: CAuDri Track Catalog
x-caudri:
  version: "1.0"
  assets_base: assets/
  regulations: regulations.yaml

$defs:
  global:
    $defs:
      rendering:
        type: object
        properties:
          asset_path:
            description: Base path or URI against which relative Catalog asset references are resolved. Renderer configuration
              may override this location without changing a Track Description.
            type: string
            default: assets/
            format: uri-reference
        additionalProperties: false

      validation:
        $ref: regulations.yaml#/$defs/global/$defs/validation
        type: object
        properties:
          root_port: {type: string, enum: [entry, exit]}
          # Numerical endpoint-matching tolerance on loop closure and section connections.
          position_tolerance: {type: number, default: 0.001}

          connected_network: {type: boolean}
        additionalProperties: false

  road:
    $ref: regulations.yaml#/$defs/road/$defs/parameters
    type: object
    properties:
      lane_width:
        type: number
        $ref: regulations.yaml#/$defs/road/$defs/parameters/properties/lane_width
        default: 0.4
      marking_width: {type: number, default: 0.02, exclusiveMinimum: 0}
      centerline: {type: string, default: dashed}
      left_boundary: {type: string}
      right_boundary: {type: string}
      rendering: {$ref: '#/$defs/road/$defs/rendering'}
    additionalProperties: false

    $defs:
      rendering:
        $ref: regulations.yaml#/$defs/road/$defs/rendering
        type: object
        properties:
          marking_color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
          centerline_dashed_stroke_length: {type: number}
          centerline_dashed_gap_length: {type: number}
          centerline_double_line_spacing: {type: number, default: 0.02}
          centerline_double_total_width: {type: number}
          centerline_control_gap:
            description: Longitudinal clearance between a centerline and a controlling Road Element edge, such as an Intersection
              control line or Crosswalk.
            type: number
            default: 0.15
            minimum: 0
          centerline_minimum_terminal_stroke_ratio:
            description: Minimum visible fraction of a dashed centerline stroke where it is clipped at a control gap. Shorter
              terminal fragments are omitted without changing the continuous dash phase.
            type: number
            default: 0.25
            minimum: 0
            maximum: 1
          surface_color: {type: string, default: '#1A1A1A', pattern: '^#[0-9A-Fa-f]{6}$'}
        additionalProperties: false

      validation:
        $ref: regulations.yaml#/$defs/road/$defs/validation
        type: object
        properties:
          lane_count: {type: integer, minimum: 1}
          lanes_per_direction: {type: integer, minimum: 1}
          road_element_spacing: {type: number}
          neighboring_road_spacing: {type: number}
          artifact_marking_spacing: {type: number}
          obstacle_spacing: {type: number}
          marking_type_minimum_length: {type: number}
        additionalProperties: false

  identifier: {type: string, pattern: '^[a-z][a-z0-9_-]*$'} 
   
  metadata:
    type: object
    properties:
      name: {type: string}
      description: {type: string}
      tags:
        type: array
        items: {type: string}
        uniqueItems: true
      author: {type: string}
    additionalProperties: false

  root:
    description: Map origin at a section port, with the positive Map x-axis aligned to its forward tangent.
    type: object
    required: [section, port]
    properties:
      section: {$ref: '#/$defs/identifier'}
      port:
        type: string
        $ref: regulations.yaml#/$defs/global/$defs/validation/properties/root_port
        enum: [entry, exit]
      map_orientation:
        description: Counter-clockwise rotation of the Map frame about World z, in degrees. All map-local
          positions and orientations are transformed together; no track geometry changes.
        type: number
        default: 0
    additionalProperties: false

  # Changing the direction to "backward" locally changes the orientation of paths on a section.
  # "left" and "right" directions will change accordingly, local coordinates stay the same.
  direction:
    description: Travel direction relative to the owner Section. Backward reverses travel and direction-relative left/right
      semantics.
    type: string
    enum: [forward, backward]
    default: forward

  pose:
    description: Absolute pose in the Map frame.
    type: object
    required: [x, y, z, yaw]
    properties:
      x: {type: number}
      y: {type: number}
      z: {type: number}
      yaw: {type: number}
      pitch: {type: number, default: 0}
      roll: {type: number, default: 0}
    additionalProperties: false

  size:
    $ref: '#/$defs/size/$defs/patch'
    required: [length, width]
    $defs:
      patch:
        description: Object-aligned extents, omitted height denotes a flat 2D object.
        type: object
        properties:
          length: {type: number, exclusiveMinimum: 0}
          width: {type: number, exclusiveMinimum: 0}
          height: {type: number, exclusiveMinimum: 0}
        additionalProperties: false

  # Generic size also serves artifacts and markers; only obstacles use these limits.
  # Shared by static_obstacle features and dynamic_obstacle actors.
  obstacles: # TODO: Define locally at the obstacle type?
    $defs:
      size:
        allOf:
          - {$ref: '#/$defs/size/$defs/patch'}
          - {$ref: regulations.yaml#/$defs/obstacles/$defs/size}
        properties:
          height: {default: 0.15}


  # Local position on a (linear) section, relative to its entry port.
  # The position does not change when inverting the direction of travel on the section.
  local_position:
    type: object
    required: [distance]
    properties:
      distance:
        description: Arc length from Section entry [m].
        type: number
        minimum: 0
      offset:
        description: Signed offset from the reference line; positive is left [m].
        type: number
        default: 0
      upward_offset:
        description: Signed upward offset [m].
        type: number
        default: 0
      yaw:
        description: Counter-clockwise from the local tangent [deg].
        type: number
        default: 0

  # Global position on any section, wrapping the intersection and linear section definitions.
  # The section ID is only required for global objects referencing a specific section.
  # Nested objects will inherit the section ID from their parent.
  position:
    type: object
    properties:
      section: {$ref: '#/$defs/identifier'}
    oneOf:
      - {$ref: '#/$defs/local_position'}
      - {$ref: '#/$defs/sections/$defs/intersection/$defs/local_position'}
    unevaluatedProperties: false

  port_reference: {type: string, pattern: '^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_-]*$'}

  # Exactly two port references. Unique use of ports needs further validation.
  connection:
    type: array
    prefixItems:
      - {$ref: '#/$defs/port_reference'}
      - {$ref: '#/$defs/port_reference'}
    minItems: 2
    maxItems: 2

  actor_spawn:
    oneOf:
      - type: object
        required: [at]
        properties:
          at: {$ref: '#/$defs/position', required: [section]}
          direction: {$ref: '#/$defs/direction'}
        additionalProperties: false
      - type: object
        required: [pose]
        properties:
          pose: {$ref: '#/$defs/pose'}
        additionalProperties: false

  side:
    description: Side as seen in the owning object's travel direction, not a fixed global or Section-frame side.
    type: string
    enum: [left, right]

  # Intersections use "entry", "left", "straight" and "right" ports. All other sections use "entry" and "exit" ports.
  port: {type: string, enum: [entry, exit, left, straight, right]}

  range:
    description: Half-open Section-local interval `[start, end)` in meters; start must be smaller than end.
    type: object
    required: [start, end]
    properties:
      start: {type: number, minimum: 0}
      end: {type: number, minimum: 0}
    additionalProperties: false

  # Start and end points of a zone span
  span_limit:
    description: Endpoint using exactly one Section-local distance or named port.
    type: object
    oneOf:
      - {required: [distance]}
      - {required: [port]}
    required: [section]
    properties:
      section: {$ref: '#/$defs/identifier'}
      distance: {type: number, minimum: 0}
      port: {$ref: '#/$defs/port'}
    additionalProperties: false

  span:
    description: Directed path from start to end; `via` Section IDs are visited in listed order to resolve branches. (WIP)
    type: object
    required: [start, end]
    properties:
      start: {$ref: '#/$defs/span_limit'}
      end: {$ref: '#/$defs/span_limit'}
      via:
        type: array
        items: {$ref: '#/$defs/identifier'}
        uniqueItems: true
    additionalProperties: false

  actor_stop:
    description: Explicit temporary stop at a Section-local distance for a duration in seconds.
    type: object
    required: [section, distance, duration]
    properties:
      section: {$ref: '#/$defs/identifier'}
      distance: {type: number, minimum: 0}
      duration: {type: number, exclusiveMinimum: 0}
    additionalProperties: false

  sections:
    oneOf:
      - {$ref: '#/$defs/sections/$defs/straight'}
      - {$ref: '#/$defs/sections/$defs/arc'}
      - {$ref: '#/$defs/sections/$defs/clothoid'}
      - {$ref: '#/$defs/sections/$defs/intersection'}

    $defs:
      straight:
        $ref: '#/$defs/road_section_base'
        description: Straight reference-line primitive.
        required: [type, parameters]
        properties:
          type: {const: straight}
          parameters:
            type: object
            required: [length]
            properties:
              length: {type: number, exclusiveMinimum: 0}
            additionalProperties: false
          elements:
            type: object
            additionalProperties:
              oneOf:
                - {const: false}
                - {$ref: '#/$defs/elements/$defs/crosswalk'}
                - {$ref: '#/$defs/elements/$defs/barred_area'}
                - {$ref: '#/$defs/elements/$defs/side_road_junction'}
                - {$ref: '#/$defs/elements/$defs/parking_area'}
                - {$ref: '#/$defs/elements/$defs/starting_line'}
            propertyNames: {$ref: '#/$defs/identifier'}
            default: {}
          features: # TODO: Why do we use object types for the elements but arrays for the features? 
            additionalProperties:
              properties:
                at: {$ref: '#/$defs/local_position'}
                type: {enum: [traffic_sign, landmark, static_obstacle, artifact, custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          ports: {fixed: [entry, exit]}

      arc:
        $ref: '#/$defs/road_section_base'
        description: Constant-curvature circular arc primitive.
        required: [type, parameters]
        properties:
          type: {const: arc}
          parameters:
            type: object
            required: [radius, angle]
            properties:
              direction: {type: string, enum: [left, right], default: left}
              radius:
                description: Radius of the reference (center) line.
                type: number
                exclusiveMinimum: 0
              angle:
                description: Unsigned swept angle; `direction` determines left or right curvature.
                type: number
                exclusiveMinimum: 0
                maximum: 360
            additionalProperties: false
          elements:
            type: object
            additionalProperties:
              oneOf:
                - {const: false}
                - {$ref: '#/$defs/elements/$defs/starting_line'}
                - {$ref: '#/$defs/elements/$defs/start_box'}
            propertyNames: {$ref: '#/$defs/identifier'}
            default: {}
          features:
            additionalProperties:
              properties:
                at: {$ref: '#/$defs/local_position'}
                type: {enum: [traffic_sign, landmark, static_obstacle, artifact, custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          ports: {fixed: [entry, exit]}

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/sections/$defs/arc/$defs/validation
            type: object
            properties:
              inner_radius:
                description: Smallest radius of the innermost drivable road boundary, derived from geometry and road width.
                type: number
            additionalProperties: false

      # Clothoids are curved transition sections with a linear curvature change.
      # Entry and exit curvature must differ. This must be checked by the validator.
      clothoid:
        $ref: '#/$defs/road_section_base'
        description: Linear-curvature transition primitive.
        required: [type, parameters]
        properties:
          type: {const: clothoid}
          parameters:
            type: object
            required: [length, start_curvature, end_curvature]
            properties:
              length: {type: number, exclusiveMinimum: 0}
              start_curvature:
                description: Signed curvature at entry; positive turns left in the Section frame.
                type: number
              end_curvature:
                description: Signed curvature at exit; positive turns left in the Section frame.
                type: number
            additionalProperties: false
          elements:
            type: object
            additionalProperties:
              oneOf:
                - {const: false}
                - {$ref: '#/$defs/elements/$defs/starting_line'}
            propertyNames: {$ref: '#/$defs/identifier'}
            default: {}
          features:
            additionalProperties:
              properties:
                at: {$ref: '#/$defs/local_position'}
                type: {enum: [traffic_sign, landmark, static_obstacle, artifact, custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          ports: {fixed: [entry, exit]}

      intersection:
        $ref: '#/$defs/road_section_base'
        description: Three- or four-arm intersection.
        required: [type]
        properties:
          type: {const: intersection}
          parameters:
            $ref: regulations.yaml#/$defs/sections/$defs/intersection/$defs/parameters
            type: object
            properties:
              layout:
                description: Intersection variant implemented under `variants`.
                type: string
                default: priority_to_right
              ports:
                description: Optional arm ports; `entry` exists implicitly.
                type: array
                items: {enum: [left, straight, right]}
                default: [left, straight, right]
                minItems: 2
                uniqueItems: true
              # Controlled ports need to be specified independently of the variant or mandatory turn for now
              controlled_ports:
                description: Incoming approaches receiving the layout's stop or give-way control.
                type: array
                items: {enum: [entry, left, straight, right]}
                default: []
                uniqueItems: true
              mandatory_turn:
                description: The two non-opposite ports joined by a bidirectional mandatory turn.
                type: array
                items: {enum: [entry, left, straight, right]}
                minItems: 2
                maxItems: 2
                uniqueItems: true
              angle:
                description: Directed counter-clockwise angle from the entry axis to the right-arm axis in top view. Values
                  below 90 degrees give the crossing road a negative slope and values above 90 degrees a positive slope.
                type: number
                default: 90
              corner_radius:
                description: Radius of rounded lane-boundary corners at the intersection.
                type: number
                default: 0.1
                minimum: 0
              port_distance:
                description: Distance from the intersection axis crossing to every port along that arm's reference line.
                type: number
                default: 0.8
                exclusiveMinimum: 0
              priority_sign_distance: {type: number, default: 0.4}
              mandatory_sign_distance: {type: number, default: 0.25}
              mandatory_marking_distance: {type: number, default: 0.15}
            additionalProperties: false
          elements:
            type: object
            additionalProperties: {const: false}
            propertyNames: {$ref: '#/$defs/identifier'}
            default: {}
          features:
            additionalProperties:
              properties:
                at: {$ref: '#/$defs/sections/$defs/intersection/$defs/local_position'}
                type: {enum: [traffic_sign, surface_marking, custom_marker]}
          simulation: {$ref: '#/$defs/sections/$defs/intersection/$defs/simulation'}
        unevaluatedProperties: false
        x-caudri:
          ports: {fixed: [entry], optional: [left, straight, right], default: [left, straight, right]}
          variants:
            stop:
              expansion:
                controlled:
                  stop_line:
                    type: surface_marking
                    parameters: {marking: stop_line}
                  stop_sign:
                    type: traffic_sign
                    parameters: {sign: stop}
                uncontrolled:
                  priority_sign:
                    type: traffic_sign
                    parameters: {sign: priority_road}
            give_way:
              expansion:
                controlled:
                  give_way_line:
                    type: surface_marking
                    parameters: {marking: give_way_line}
                  give_way_sign:
                    type: traffic_sign
                    parameters: {sign: give_way}
                uncontrolled:
                  priority_sign:
                    type: traffic_sign
                    parameters: {sign: priority_road}
            priority_to_right:
              expansion:
                all:
                  give_way_line:
                    type: surface_marking
                    parameters: {marking: give_way_line}
          mandatory_direction:
            parameter: mandatory_turn
            expansion:
              sign_by_turn: {left: mandatory_left, right: mandatory_right}
              surface_marking: mandatory_direction

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/sections/$defs/intersection/$defs/validation
            type: object
            properties:
              dynamic_obstacle_count: {type: integer}
            additionalProperties: false

            $defs:
              stop:
                $ref: regulations.yaml#/$defs/sections/$defs/intersection/$defs/validation/$defs/stop
                type: object
                properties:
                  controlled_port_count: {type: integer}
                additionalProperties: false

              give_way:
                $ref: regulations.yaml#/$defs/sections/$defs/intersection/$defs/validation/$defs/give_way
                type: object
                properties:
                  controlled_port_count: {type: integer}
                additionalProperties: false

          simulation:
            $ref: regulations.yaml#/$defs/sections/$defs/intersection/$defs/simulation
            type: object
            properties:
              priority_obstacle_distance_before_stop_line: {type: number, default: 0.25}
              priority_obstacle_distance_after_stop_line: {type: number, default: 0.2}
            additionalProperties: false

          local_position:
            description: Cartesian position in the intersection frame; yaw is relative to its x-axis.
            type: object
            required: [x, y]
            properties:
              x: {type: number}
              y: {type: number}
              upward_offset: {type: number, default: 0}
              yaw:
                description: Counter-clockwise from the Section x-axis [deg].
                type: number
                default: 0

  elements:
    oneOf:
      - {$ref: '#/$defs/elements/$defs/start_box'}
      - {$ref: '#/$defs/elements/$defs/starting_line'}
      - {$ref: '#/$defs/elements/$defs/crosswalk'}
      - {$ref: '#/$defs/elements/$defs/barred_area'}
      - {$ref: '#/$defs/elements/$defs/side_road_junction'}
      - {$ref: '#/$defs/elements/$defs/parking_area'}

    $defs:
      # `lower_edge_height` applies equally to the STOP panel and QR code.
      # The mechanical start box shares this Element's footprint but has no independent track description object.
      start_box:
        $ref: '#/$defs/road_element_base'
        description: Start-area markings behind the root exit.
        required: [type]
        properties:
          type: {const: start_box}
          parameters:
            $ref: regulations.yaml#/$defs/elements/$defs/start_box/$defs/parameters
            type: object
            properties:
              length: {type: number, default: 2.0, exclusiveMinimum: 0}
              horizontal_gap: {type: number, default: 0.05}
              lower_edge_height: {type: number, default: 0.15}
            additionalProperties: false

          rendering: {$ref: '#/$defs/elements/$defs/start_box/$defs/rendering'}
          simulation: {$ref: '#/$defs/elements/$defs/start_box/$defs/simulation'}
          features:
            type: object
            additionalProperties:
              properties:
                type: {enum: [custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          compatibility: {root_only: true}
          defaults: {slot: start_box, enabled: true}

        $defs:
          rendering:
            $ref: regulations.yaml#/$defs/elements/$defs/start_box/$defs/rendering
            type: object
            properties:
              stop_panel_width: {type: number, default: 0.15}
              stop_panel_height: {type: number, default: 0.15}
              stop_qr_width: {type: number, default: 0.15}
              stop_qr_height: {type: number, default: 0.15}
              qr_payload: {type: string}
              qr_version: {type: integer}
              qr_error_correction: {type: string}
              qr_mode: {type: string}
              qr_mask_pattern: {type: integer}
              qr_overlay: {type: string}
              qr_artwork: {type: string}
            additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/elements/$defs/start_box/$defs/validation
            type: object
            properties:
              root_section_type: {type: string}
              root_section_direction: {type: string}
            additionalProperties: false

          simulation:
            $ref: regulations.yaml#/$defs/elements/$defs/start_box/$defs/simulation
            type: object
            properties:
              gate_open_duration: {type: number, exclusiveMinimum: 0}
            additionalProperties: false

      # The root starting line starts at the specified root port and extends forward.
      # If the root port is an exit port, the starting line extends into the connected successor section.
      # The root starting line defines the map origin on the centerline at the trailing edge of the starting line.
      # If the starting line is disabled, the map origin is still defined at the theoretical position.
      starting_line:
        $ref: '#/$defs/road_element_base'
        description: Starting line marking at the root entry/exit or at a section-local position.
        # For testing/debugging purposes, the starting line can also be painted solid.
        if:
          required: [parameters]
          properties:
            parameters: {required: [pattern], properties: {pattern: {const: solid}}}
        then:
          properties:
            rendering: {$ref: '#/$defs/elements/$defs/starting_line/$defs/rendering/$defs/solid'}
        else:
          properties:
            rendering: {$ref: '#/$defs/elements/$defs/starting_line/$defs/rendering/$defs/checkered'}
        required: [type]
        properties:
          type: {const: starting_line}
          parameters:
            $ref: regulations.yaml#/$defs/elements/$defs/starting_line/$defs/parameters
            type: object
            properties:
              distance:
                description: Section-local trailing-edge position for an explicitly placed Starting Line. Omitted only for
                  the root `starting_line` default slot.
                type: number
                minimum: 0
              pattern:
                type: string
                default: checkered
            additionalProperties: false

          rendering: {$ref: '#/$defs/elements/$defs/starting_line/$defs/rendering'}
          features:
            type: object
            additionalProperties:
              const: false
        unevaluatedProperties: false
        x-caudri:
          defaults: {slot: starting_line, enabled: true}

        $defs:
          rendering:
            anyOf:
              - {$ref: '#/$defs/elements/$defs/starting_line/$defs/rendering/$defs/checkered'}
              - {$ref: '#/$defs/elements/$defs/starting_line/$defs/rendering/$defs/solid'}
            $defs:
              checkered:
                type: object
                properties:
                  width: {type: number, default: 0.05}
                  # Catalog default for checkered Starting Lines: 1/3 of the default 0.05 m total line width. 
                  # A Track Description may override this value.
                  checker_size: {type: number, default: 0.0166666666666667, exclusiveMinimum: 0}
                additionalProperties: false

              solid:
                type: object
                properties:
                  # Catalog choice for the optional solid line; no width is prescribed specifically for it.
                  width: {type: number, default: 0.02, exclusiveMinimum: 0}
                additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/elements/$defs/starting_line/$defs/validation
            type: object
            properties:
              maximum_count: {type: integer, minimum: 0}
              root_only: {type: boolean}
              trailing_edge_at_root_exit: {type: boolean}
            additionalProperties: false

      crosswalk:
        $ref: '#/$defs/road_element_base'
        description: Zebra crossing with roadside signs and pedestrian waiting areas.
        required: [type, parameters]
        properties:
          type: {const: crosswalk}
          parameters:
            $ref: regulations.yaml#/$defs/elements/$defs/crosswalk/$defs/parameters
            type: object
            required: [distance]
            properties:
              distance:
                description: Section-local position of the Crosswalk's first longitudinal edge.
                type: number
                minimum: 0
              direction: {$ref: '#/$defs/direction'}
              sign_distance: {type: number, default: 0.3}
              waiting_area_sides:
                type: array
                items: {$ref: '#/$defs/side'}
                default: [left, right]
              waiting_area_lateral_extent: {type: number, default: 0.2}
              waiting_area_longitudinal_extent: {type: number, default: 0.45}
            additionalProperties: false

          rendering:
            $ref: regulations.yaml#/$defs/elements/$defs/crosswalk/$defs/rendering
            type: object
            properties:
              stripe_width:
                description: Stripe width perpendicular to travel; stripe length is parallel to travel.
                type: number
                default: 0.04
              stripe_length: {type: number}
              stripe_gap: {type: number}
              waiting_area_color: {type: string, default: '#D03030'}
              waiting_area_outline_width: {type: number, default: 0.01}
              waiting_area_dash_length: {type: number, default: 0.05}
              waiting_area_dash_gap: {type: number, default: 0.05}
            additionalProperties: false
          features:
            type: object
            properties:
              sign_forward:
                properties:
                  type: {const: traffic_sign}
              sign_backward:
                properties:
                  type: {const: traffic_sign}
            additionalProperties:
              properties:
                type: {enum: [custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          expansion:
            sign_forward:
              type: traffic_sign
              parameters: {sign: crosswalk, faces: forward}
            sign_backward:
              type: traffic_sign
              parameters: {sign: crosswalk, faces: backward}
            # Waiting areas are derived from parameters.waiting_area_sides.

      barred_area:
        $ref: '#/$defs/road_element_base'
        description: Trapezoidal hatched marking blocking one lane.
        required: [type, parameters]
        properties:
          type: {const: barred_area}
          parameters:
            $ref: regulations.yaml#/$defs/elements/$defs/barred_area/$defs/parameters
            type: object
            required: [range]
            properties:
              range: {$ref: '#/$defs/range'}
              direction: {$ref: '#/$defs/direction'}
              outline_side_angle: {type: number, default: 60}
              # The lateral extend isn't actually defined in the Regulations
              lateral_extent:
                description: Depth from the inside edge of the adjacent outer marking toward the centerline.
                type: number
                default: 0.25
              priority_sign_distance: {type: number, default: 0.3}
            additionalProperties: false

          rendering: {$ref: '#/$defs/elements/$defs/barred_area/$defs/rendering'}
          features:
            type: object
            properties:
              priority_sign:
                properties:
                  type: {const: traffic_sign}
            additionalProperties:
              properties:
                type: {enum: [custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          expansion:
            priority_sign:
              type: traffic_sign
              parameters: {sign: oncoming_traffic_priority}

        $defs:
          rendering:
            $ref: regulations.yaml#/$defs/elements/$defs/barred_area/$defs/rendering
            type: object
            properties:
              # Outline and hatch angles are measured against the outer lane boundary.
              # hatch_longitudinal_gap is the free gap along that boundary, not the
              # center-to-center pitch and not a lateral or perpendicular distance.
              outline_width: {type: number, default: 0.02}
              hatch_angle: {type: number, default: 27}
              hatch_width: {type: number, default: 0.04}
              hatch_longitudinal_gap: {type: number, default: 0.15}
            additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/elements/$defs/barred_area/$defs/validation
            type: object
            properties:
              length: {type: number, exclusiveMinimum: 0}
              blocked_lane_count: {type: integer}
              dynamic_obstacle_count: {type: integer}
            additionalProperties: false

      side_road_junction:
        $ref: '#/$defs/road_element_base'
        description: Dashed non-traversable outer marking.
        required: [type, parameters]
        properties:
          type: {const: side_road_junction}
          parameters:
            type: object
            required: [range, side]
            properties:
              range: {$ref: '#/$defs/range'}
              side: {$ref: '#/$defs/side'}
              direction: {$ref: '#/$defs/direction'}
            additionalProperties: false

          rendering: {$ref: '#/$defs/elements/$defs/side_road_junction/$defs/rendering'}
          features:
            type: object
            additionalProperties:
              const: false
        unevaluatedProperties: false

        $defs:
          rendering:
            $ref: regulations.yaml#/$defs/elements/$defs/side_road_junction/$defs/rendering
            type: object
            properties:
              stroke_length: {type: number}
              gap_length: {type: number}
            additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/elements/$defs/side_road_junction/$defs/validation
            type: object
            properties:
              length: {type: number, exclusiveMinimum: 0}
            additionalProperties: false

      # `parallel_parking` and `perpendicular_parking` determine type and side;
      # omit a slot or set it to `false` to disable it. Distances and extents are
      # independent, so opposite bays need not align.
      # Announcement distance is measured along the designated route before the
      # first Parking Area. Spot `extent_along_road` is always parallel to the road;
      # `extent_lateral` is depth away from it, regardless of parking type.
      # Parallel depth starts at the road's outer marking line. A Parking Area is
      # enclosed by a three-sided trapezoidal outline; the existing road boundary
      # is its open fourth side. Its sloped ends use the configured default angle,
      # which must satisfy the Regulations range.
      # `direction` defines approach order. Lot distances are measured from the
      # Parking Area range start, Spot distances from their Lot origin; backward
      # direction reverses the order used for increasing parallel-spot lengths. # TODO: Rephrase and move the comments to the required properties
      parking_area:
        $ref: '#/$defs/road_element_base'
        description: Straight planar area containing parallel or perpendicular parking lots.
        required: [type, parameters]
        properties:
          type: {const: parking_area}
          parameters:
            # At least one bay must be enabled. Omitted bays are absent, not auto-generated.
            anyOf:
              - required: [parallel_parking]
                properties: {parallel_parking: {type: object}}
              - required: [perpendicular_parking]
                properties: {perpendicular_parking: {type: object}}
            $ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/parameters
            type: object
            required: [range]
            properties:
              range: {$ref: '#/$defs/range'}
              direction: {$ref: '#/$defs/direction'}
              parallel_parking:
                description: Parallel parking bay on the direction-relative right side.
                oneOf:
                  - {const: false}
                  - {$ref: '#/$defs/elements/$defs/parking_area/$defs/parallel_parking_lot'}

              perpendicular_parking:
                description: Perpendicular parking bay on the direction-relative left side.
                oneOf:
                  - {const: false}
                  - {$ref: '#/$defs/elements/$defs/parking_area/$defs/perpendicular_parking_lot'}

              # Angle between a sloped end of the bay outline and the outer road marking.
              boundary_side_angle: {type: number, default: 60}
              announcement_sign_distance: {type: number, default: 0.3}
            additionalProperties: false

          rendering:
            $ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/rendering
            type: object
            properties:
              parallel_outer_marking_width: {type: number, default: 0.02}
              perpendicular_separator_width: {type: number, default: 0.02}
              boundary_outline_width: {type: number, default: 0.02}
            additionalProperties: false
          features:
            type: object
            properties:
              announcement_sign:
                properties:
                  type: {const: traffic_sign}
            additionalProperties:
              properties:
                type: {enum: [static_obstacle, custom_marker]}
        unevaluatedProperties: false
        x-caudri:
          expansion:
            announcement_sign:
              type: traffic_sign
              parameters: {sign: parking_zone}

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/validation
            type: object
            properties:
              parallel_spot_count: {type: integer}
              parallel_final_spot_length: {type: number}
              parallel_obstacle_lateral_gap: {type: number}
              parallel_invalid_gap_below: {type: number}
              parallel_side: {type: string, enum: [left, right]}
              perpendicular_spot_count: {type: integer}
              perpendicular_obstacle_lateral_gap: {type: number}
              perpendicular_side: {type: string, enum: [left, right]}
              centerline: {type: string}
            additionalProperties: false

          parking_lot:
            type: object
            required: [distance, spots]
            properties:
              distance:
                description: Longitudinal offset from the Parking Area range start to this Lot origin.
                type: number
                minimum: 0
              extent_along_road:
                description: Optional independent longitudinal extent of this parking bay. It defaults to the remaining Parking Area range.
                type: number
                exclusiveMinimum: 0
              extent_lateral:
                description: Default depth of this lot's spots, measured away from the road.
                type: number
                exclusiveMinimum: 0
              spots: {$ref: '#/$defs/elements/$defs/parking_area/$defs/parking_spots'}
              features:
                $ref: '#/$defs/feature_slots'
                additionalProperties:
                  properties:
                    type: {enum: [static_obstacle, custom_marker]}
                    at: {$ref: '#/$defs/local_position'}
              metadata: {type: object}
            additionalProperties: false

          parking_spots:
            type: object
            additionalProperties:
              type: object
              required: [distance, extent_along_road]
              properties:
                distance:
                  description: Longitudinal offset from the Parking Lot origin to this Spot start; mapping order has no meaning.
                  type: number
                  minimum: 0
                state: {enum: [free, blocked, no_parking], default: free}
                extent_along_road:
                  description: Spot extent parallel to the owner Section reference line.
                  type: number
                  exclusiveMinimum: 0
                extent_lateral:
                  description: Spot depth away from the road; omitted values inherit the containing lot depth.
                  type: number
                  exclusiveMinimum: 0
                features:
                  $ref: '#/$defs/feature_slots'
                  additionalProperties:
                    properties:
                      type: {enum: [static_obstacle, custom_marker]}
                      at: {$ref: '#/$defs/local_position'}
                  properties:
                    obstacle:
                      properties:
                        type: {const: static_obstacle}
                metadata: {type: object}
              additionalProperties: false
              x-caudri:
                expansion:
                  # Generated only for blocked spots; features.obstacle can override or disable this slot.
                  # The renderer derives its position and footprint from the spot and obstacle limits.
                  # Height inherits the shared 0.15 m obstacle default.
                  obstacle:
                    when: {state: blocked}
                    type: static_obstacle
            propertyNames: {$ref: '#/$defs/identifier'}
            minProperties: 1

          parallel_parking_lot:
            $ref: '#/$defs/elements/$defs/parking_area/$defs/parking_lot'
            properties:
              extent_lateral:
                $ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/parallel_spot/properties/extent_lateral
                default: 0.3
              spots:
                additionalProperties: {$ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/parallel_spot}

          perpendicular_parking_lot:
            $ref: '#/$defs/elements/$defs/parking_area/$defs/parking_lot'
            properties:
              extent_lateral:
                $ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/perpendicular_spot/properties/extent_lateral
                default: 0.5
              spots:
                additionalProperties: {$ref: regulations.yaml#/$defs/elements/$defs/parking_area/$defs/perpendicular_spot}

  features:
    oneOf:
      - {$ref: '#/$defs/features/$defs/traffic_sign'}
      - {$ref: '#/$defs/features/$defs/surface_marking'}
      - {$ref: '#/$defs/features/$defs/landmark'}
      - {$ref: '#/$defs/features/$defs/static_obstacle'}
      - {$ref: '#/$defs/features/$defs/artifact'}
      - {$ref: '#/$defs/features/$defs/custom_marker'}

    $defs:
      traffic_sign:
        $ref: '#/$defs/features/$defs/traffic_sign/$defs/patch'
        description: Physical roadside traffic sign.
        required: [type, parameters]
        properties:
          parameters:
            if:
              required: [sign]
              properties:
                sign:
                  enum: [speed_limit_begin, speed_limit_end, uphill_grade, downhill_grade]
            then:
              required: [displayed_value]
            required: [sign]
        unevaluatedProperties: false
        x-caudri:
          variants:
            stop: {shape: octagon, size: standard}
            give_way: {shape: triangle, size: standard}
            priority_road: {shape: diamond, size: priority}
            mandatory_left: {shape: circle, size: round}
            mandatory_right: {shape: circle, size: round}
            crosswalk: {shape: square, size: standard}
            parking_zone: {shape: square, size: standard}
            oncoming_traffic_priority: {shape: circle, size: round}
            speed_limit_begin: {shape: square, size: standard}
            speed_limit_end: {shape: square, size: standard}
            no_passing_begin: {shape: circle, size: round}
            no_passing_end: {shape: circle, size: round}
            expressway_begin: {shape: square, size: standard}
            expressway_end: {shape: square, size: standard}
            uphill_grade: {shape: triangle, size: standard}
            downhill_grade: {shape: triangle, size: standard}
            guide_left: {shape: square, size: guide}
            guide_left_multiple: {shape: rectangle, size: guide_multiple}
            guide_right: {shape: square, size: guide}
            guide_right_multiple: {shape: rectangle, size: guide_multiple}

        $defs:
          parameters:
            $ref: regulations.yaml#/$defs/features/$defs/traffic_sign/$defs/parameters
            type: object
            if:
              required: [sign]
              properties:
                sign:
                  not: {enum: [speed_limit_begin, speed_limit_end, uphill_grade, downhill_grade]}
            then:
              properties:
                displayed_value: false
            properties:
              sign: {type: string}
              displayed_value:
                description: Number printed by variants such as speed-limit or grade signs; omitted for non-numeric signs.
                type: number
              faces:
                description: Travel direction from which the sign front is visible.
                $ref: '#/$defs/direction'
              lateral_offset:
                description: Distance outward from the right-hand lane boundary (not from the road reference line).
                type: number
                default: 0.1
                exclusiveMinimum: 0
              lower_edge_height: {type: number, default: 0.15}
              guide_first_advance: {type: number, default: 1.5}
              guide_repetition_distance: {type: number, default: 0.4}
            additionalProperties: false

          rendering:
            $ref: regulations.yaml#/$defs/features/$defs/traffic_sign/$defs/rendering
            type: object
            properties:
              # Variant schemas below supply asset defaults; an explicit asset wins.
              asset: {type: string, format: uri-template}
              standard_width: {type: number, default: 0.15}
              standard_height: {type: number, default: 0.15}
              round_diameter: {type: number, default: 0.1}
              # Axis-aligned bounding sizes; priority width/height are diagonals.
              priority_width: {type: number, default: 0.1}
              priority_height: {type: number, default: 0.1}
              guide_width: {type: number, default: 0.1}
              guide_height: {type: number, default: 0.1}
              guide_multiple_width: {type: number, default: 0.3}
              guide_multiple_height: {type: number, default: 0.1}
            additionalProperties: false

            $defs:
              stop:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/stop.svg, format: uri-template}
                additionalProperties: false

              give_way:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/give_way.svg, format: uri-template}
                additionalProperties: false

              priority_road:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/priority_road.svg, format: uri-template}
                additionalProperties: false

              mandatory_left:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/mandatory_left.svg, format: uri-template}
                additionalProperties: false

              mandatory_right:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/mandatory_right.svg, format: uri-template}
                additionalProperties: false

              crosswalk:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/crosswalk.svg, format: uri-template}
                additionalProperties: false

              parking_zone:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/parking_zone.svg, format: uri-template}
                additionalProperties: false

              oncoming_traffic_priority:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/oncoming_traffic_priority.svg, format: uri-template}
                additionalProperties: false

              speed_limit_begin:
                type: object
                properties:
                  asset: {type: string, default: 'traffic_sign/speed_limit_begin/{displayed_value}.svg', format: uri-template}
                additionalProperties: false

              speed_limit_end:
                type: object
                properties:
                  asset: {type: string, default: 'traffic_sign/speed_limit_end/{displayed_value}.svg', format: uri-template}
                additionalProperties: false

              no_passing_begin:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/no_passing_begin.svg, format: uri-template}
                additionalProperties: false

              no_passing_end:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/no_passing_end.svg, format: uri-template}
                additionalProperties: false

              expressway_begin:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/expressway_begin.svg, format: uri-template}
                additionalProperties: false

              expressway_end:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/expressway_end.svg, format: uri-template}
                additionalProperties: false

              uphill_grade:
                type: object
                properties:
                  asset: {type: string, default: 'traffic_sign/uphill_grade/{displayed_value}.svg', format: uri-template}
                additionalProperties: false

              downhill_grade:
                type: object
                properties:
                  asset: {type: string, default: 'traffic_sign/downhill_grade/{displayed_value}.svg', format: uri-template}
                additionalProperties: false

              guide_left:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/guide_left.svg, format: uri-template}
                additionalProperties: false

              guide_left_multiple:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/guide_left_multiple.svg, format: uri-template}
                additionalProperties: false

              guide_right:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/guide_right.svg, format: uri-template}
                additionalProperties: false

              guide_right_multiple:
                type: object
                properties:
                  asset: {type: string, default: traffic_sign/guide_right_multiple.svg, format: uri-template}
                additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/features/$defs/traffic_sign/$defs/validation
            type: object
            properties:
              guide_curve_inner_radius: {type: number}
              guide_preceding_straight_length: {type: number}
              # A Speed Limit sign sharing a location with another sign is either side-by-side 
              # or separated by `speed_limit_separated_sign_spacing`.
              speed_limit_separated_sign_spacing: {type: number}
            additionalProperties: false

          patch:
            $ref: '#/$defs/feature_base'
            required: [type]
            properties:
              type: {const: traffic_sign}
              parameters: {$ref: '#/$defs/features/$defs/traffic_sign/$defs/parameters'}
              rendering: {$ref: '#/$defs/features/$defs/traffic_sign/$defs/rendering'}
            unevaluatedProperties: false

      # Speed-limit markings require `displayed_value`, mandatory-direction arrows
      # require `target`. Both fields are invalid on unrelated variants.
      # Give-Way dash count, phase and clipping are implicit renderer decisions.
      surface_marking:
        $ref: '#/$defs/features/$defs/surface_marking/$defs/patch'
        description: Explicit road-surface marking.
        required: [type, parameters]
        properties:
          parameters:
            allOf:
              - if:
                  required: [marking]
                  properties:
                    marking: {enum: [speed_limit_begin, speed_limit_end]}
                then: {required: [displayed_value]}
              - if:
                  required: [marking]
                  properties:
                    marking: {const: mandatory_direction}
                then: {required: [target]}
            required: [marking]
        unevaluatedProperties: false

        $defs:
          parameters:
            $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/parameters
            type: object
            # Numeric values and turn targets belong only to their respective marking variants.
            allOf:
              - if:
                  required: [marking]
                  properties: {marking: {not: {enum: [speed_limit_begin, speed_limit_end]}}}
                then:
                  properties: {displayed_value: false}
              - if:
                  required: [marking]
                  properties: {marking: {not: {const: mandatory_direction}}}
                then:
                  properties: {target: false}
            properties:
              marking: {type: string}
              displayed_value:
                description: Numeric value rendered by speed-limit surface markings.
                type: integer
              target:
                description: Turn target used only by mandatory-direction arrow markings.
                enum: [left, right]
            additionalProperties: false

          rendering:
            anyOf:
              - {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/stop_line'}
              - {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/give_way_line'}
              - {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_begin'}
              - {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_end'}
              - {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/mandatory_direction'}
            $defs:
              stop_line:
                $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/stop_line
                type: object
                properties:
                  width: {type: number, default: 0.04}
                additionalProperties: false

              give_way_line:
                $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/give_way_line
                type: object
                properties:
                  stroke_length: {type: number}
                  gap_length: {type: number}
                  width: {type: number, default: 0.04}
                additionalProperties: false

              speed_limit_begin:
                $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_begin
                type: object
                properties:
                  asset: {type: string, default: 'surface_marking/speed_limit_begin/{displayed_value}.svg', format: uri-template}
                  digit_width: {type: number, default: 0.06}
                  digit_height: {type: number, default: 0.4}
                  total_width: {type: number, default: 0.15}
                additionalProperties: false

              speed_limit_end:
                $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_end
                type: object
                properties:
                  asset: {type: string, default: 'surface_marking/speed_limit_end/{displayed_value}.svg', format: uri-template}
                  total_width: {type: number, default: 0.2}
                  total_height: {type: number, default: 0.5}
                additionalProperties: false

              mandatory_direction:
                $ref: regulations.yaml#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/mandatory_direction
                type: object
                properties:
                  asset: {type: string, default: 'surface_marking/mandatory_{target}.svg', format: uri-template}
                  width: {type: number, default: 0.07}
                  length: {type: number, default: 0.5}
                additionalProperties: false

          patch:
            $ref: '#/$defs/feature_base'
            # Mapping from parameters.marking to the corresponding rendering schema.
            allOf:
              - if:
                  required: [parameters]
                  properties:
                    parameters:
                      required: [marking]
                      properties:
                        marking: {const: stop_line}
                then:
                  properties:
                    rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/stop_line'}
              - if:
                  required: [parameters]
                  properties:
                    parameters:
                      required: [marking]
                      properties:
                        marking: {const: give_way_line}
                then:
                  properties:
                    rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/give_way_line'}
              - if:
                  required: [parameters]
                  properties:
                    parameters:
                      required: [marking]
                      properties:
                        marking: {const: speed_limit_begin}
                then:
                  properties:
                    rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_begin'}
              - if:
                  required: [parameters]
                  properties:
                    parameters:
                      required: [marking]
                      properties:
                        marking: {const: speed_limit_end}
                then:
                  properties:
                    rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/speed_limit_end'}
              - if:
                  required: [parameters]
                  properties:
                    parameters:
                      required: [marking]
                      properties:
                        marking: {const: mandatory_direction}
                then:
                  properties:
                    rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering/$defs/mandatory_direction'}
            required: [type]
            properties:
              type: {const: surface_marking}
              parameters: {$ref: '#/$defs/features/$defs/surface_marking/$defs/parameters'}
              rendering: {$ref: '#/$defs/features/$defs/surface_marking/$defs/rendering'}
            unevaluatedProperties: false

      # faces uses section-forward travel: the right sign faces forward, the left backward.
      # Each QR code is integral to its sign. Standalone QR Features are not a
      # supported Catalog type. One sign stands on each side and faces traffic in
      # the adjacent lane, making the Landmark detectable in both directions.
      # Identifiers are unique and contiguous from zero. Placements must remain
      # unobstructed by Road Elements and obstacles. # TODO: Move comments to corresponding properties
      landmark:
        $ref: '#/$defs/features/$defs/landmark/$defs/patch'
        description: Landmark represented by roadside signs with integral QR codes.
        required: [type, parameters]
        properties:
          parameters:
            required: [identifier]
        unevaluatedProperties: false

        $defs:
          parameters:
            $ref: regulations.yaml#/$defs/features/$defs/landmark/$defs/parameters
            type: object
            properties:
              identifier:
                description: Unique numeric navigation identifier, corresponds to the QR code payload.
                type: integer
              sign_sides:
                type: array
                items: {$ref: '#/$defs/side'}
                default: [left, right]
              faces:
                description: Travel direction from which each roadside sign is visible, as for traffic_sign.faces.
                type: object
                properties:
                  left: {type: string, enum: [forward, backward], default: backward}
                  right: {$ref: '#/$defs/direction', default: forward}
                additionalProperties: false
            additionalProperties: false

          rendering:
            $ref: regulations.yaml#/$defs/features/$defs/landmark/$defs/rendering
            type: object
            properties:
              asset: {type: string, default: 'landmark/{identifier}.svg', format: uri-template}
              sign_shape: {type: string}
              sign_width: {type: number, default: 0.15}
              sign_height: {type: number, default: 0.15}
              qr_version: {type: integer}
              qr_error_correction: {type: string}
              qr_payload:
                description: Optional QR-content override for both signs. Omit to encode parameters.identifier as decimal
                  text. An explicit payload replaces the default QR artwork; differing content is for debugging only.
                type: string
              qr_profiles:
                type: object
                propertyNames: {pattern: '^[0-9]$'}
                additionalProperties:
                  type: object
                  properties:
                    mode: {type: string}
                    mask_pattern: {type: integer}
                  additionalProperties: false
            additionalProperties: false

          patch:
            allOf:
              - {$ref: '#/$defs/feature_base'}
              - {$ref: regulations.yaml#/$defs/features/$defs/landmark}
            required: [type]
            properties:
              type: {const: landmark}
              parameters: {$ref: '#/$defs/features/$defs/landmark/$defs/parameters'}
              rendering: {$ref: '#/$defs/features/$defs/landmark/$defs/rendering'}
            unevaluatedProperties: false

      static_obstacle:
        $ref: '#/$defs/features/$defs/static_obstacle/$defs/patch'
        description: Stationary box obstacle or parked vehicle.
        required: [type, size]
        properties:
          size: {$ref: '#/$defs/obstacles/$defs/size', required: [length, width]} # TODO: Height and width can also have default parameters
        unevaluatedProperties: false

        $defs:
          parameters: {type: object, additionalProperties: false}

          patch:
            $ref: '#/$defs/feature_base'
            required: [type]
            properties:
              type: {const: static_obstacle}
              parameters: {$ref: '#/$defs/features/$defs/static_obstacle/$defs/parameters'}
              simulation: {$ref: '#/$defs/features/$defs/static_obstacle/$defs/simulation'}
              size: {$ref: '#/$defs/obstacles/$defs/size'}
            unevaluatedProperties: false

          simulation:
            type: object
            properties:
              fixed_to_ground: {type: boolean, default: false}
            additionalProperties: false

      # Artifacts belong outside valid lane markings and are not part of track
      # geometry, even when they visually resemble an old marking or obstacle.
      artifact:
        description: Non-track physical object or old marking.
        $ref: '#/$defs/feature_base'
        required: [type]
        properties:
          type: {const: artifact}
          parameters:
            type: object
            properties: {}
            additionalProperties: false
        unevaluatedProperties: false

      custom_marker:
        description: Non-competition visualization or debugging marker.
        $ref: '#/$defs/feature_base'
        required: [type]
        properties:
          type: {const: custom_marker}
          parameters:
            type: object
            properties: {}
            additionalProperties: true
          rendering:
            type: object
            properties:
              asset:
                description: SVG resource rendered at the marker's pose and object-aligned size.
                type: string
                format: uri-reference
            additionalProperties: false
        unevaluatedProperties: false

      # Typed partial overrides share schemas with complete feature objects.
      patch:
        oneOf:
          - {$ref: '#/$defs/features/$defs/traffic_sign/$defs/patch'}
          - {$ref: '#/$defs/features/$defs/surface_marking/$defs/patch'}
          - {$ref: '#/$defs/features/$defs/landmark/$defs/patch'}
          - {$ref: '#/$defs/features/$defs/static_obstacle/$defs/patch'}
          - {$ref: '#/$defs/features/$defs/artifact'}
          - {$ref: '#/$defs/features/$defs/custom_marker'}

    # Complete features need both planar extents when size is supplied; patches may change one field.
    properties:
      size: {$ref: '#/$defs/size'}

  zones:
    oneOf:
      - {$ref: '#/$defs/zones/$defs/centerline'}
      - {$ref: '#/$defs/zones/$defs/missing_marking'}
      - {$ref: '#/$defs/zones/$defs/speed_limit'}
      - {$ref: '#/$defs/zones/$defs/no_passing'}
      - {$ref: '#/$defs/zones/$defs/expressway'}
      - {$ref: '#/$defs/zones/$defs/grade'}

    $defs:
      # The existing Zone direction determines track graph traversal. 
      # For `mixed`, it also identifies the side carrying the dashed component.
      # `backward` swaps the solid and dashed sides. 
      # Overlapping Centerline Zones with different effective styles are invalid.
      centerline:
        $ref: '#/$defs/zone_base'
        description: Override of the inherited centerline style.
        required: [type, parameters]
        properties:
          type: {const: centerline}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            $ref: regulations.yaml#/$defs/zones/$defs/centerline/$defs/parameters
            type: object
            required: [style]
            properties:
              style: {type: string}
              direction: {$ref: '#/$defs/direction'}
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
            additionalProperties: false
        unevaluatedProperties: false

      # Use `range` only when nested in one Section and `span` only at track root.
      # At most two ordinary lane markings may be missing simultaneously outside intersections.
      missing_marking:
        $ref: '#/$defs/zone_base'
        description: Missing lane markings over a local range or graph-spanning path.
        required: [type, parameters]
        properties:
          type: {const: missing_marking}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            type: object
            required: [markings]
            properties:
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
              direction: {$ref: '#/$defs/direction'}
              markings:
                description: Marking roles are resolved in Section-local orientation before applying travel direction.
                type: array
                items: {enum: [left_boundary, centerline, right_boundary]}
                minItems: 1
                uniqueItems: true
            additionalProperties: false
        unevaluatedProperties: false

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/zones/$defs/missing_marking/$defs/validation
            type: object
            properties:
              length:
                description: Total directed length of one continuous missing-marking Zone, including all spanned Sections.
                type: number
                exclusiveMinimum: 0
              simultaneous_count_outside_intersections:
                description: Number of marking roles absent at the same longitudinal position, not the number of Zone objects.
                type: integer
            additionalProperties: false

      # `value_kmh` is the number printed on the sign. Multiply its road-equivalent
      # speed by the scale before applying it to the 1:10 vehicle.
      speed_limit:
        $ref: '#/$defs/zone_base'
        description: Directed speed-limit interval.
        required: [type, parameters]
        properties:
          type: {const: speed_limit}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            $ref: regulations.yaml#/$defs/zones/$defs/speed_limit/$defs/parameters
            type: object
            required: [value_kmh]
            properties:
              value_kmh: {type: integer, exclusiveMinimum: 0}
              direction: {$ref: '#/$defs/direction'}
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
            additionalProperties: false

          simulation: {$ref: '#/$defs/zones/$defs/speed_limit/$defs/simulation'}
        unevaluatedProperties: false
        x-caudri:
          expansion:
            # Traffic sign parameters are derived from the parent zone's speed limit value.
            begin_sign:
              type: traffic_sign
              parameters: {sign: speed_limit_begin}
              parameters_from: {displayed_value: owner.parameters.value_kmh}
            begin_marking:
              type: surface_marking
              parameters: {marking: speed_limit_begin}
              parameters_from: {displayed_value: owner.parameters.value_kmh}
            end_sign:
              type: traffic_sign
              parameters: {sign: speed_limit_end}
              parameters_from: {displayed_value: owner.parameters.value_kmh}
            end_marking:
              type: surface_marking
              parameters: {marking: speed_limit_end}
              parameters_from: {displayed_value: owner.parameters.value_kmh}

        $defs:
          simulation:
            $ref: regulations.yaml#/$defs/zones/$defs/speed_limit/$defs/simulation
            type: object
            properties:
              displayed_to_vehicle_speed_scale: {type: number}
            additionalProperties: false

      # This Zone defaults to a `double_solid` centerline.
      # With `mixed`, direction selects the protected driving lane, whose adjacent component is SOLID 
      # (unlike a centerline Zone, whose direction selects the DASHED side).
      no_passing:
        $ref: '#/$defs/zone_base'
        description: Directed no-passing interval.
        required: [type, parameters]
        properties:
          type: {const: no_passing}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            $ref: regulations.yaml#/$defs/zones/$defs/no_passing/$defs/parameters
            type: object
            properties:
              centerline: {type: string, default: double_solid}
              direction:
                $ref: '#/$defs/direction'
                description: Protected driving direction; with mixed lines its adjacent component is solid. Forward protects
                  the right lane, backward the left lane.
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
            additionalProperties: false
        unevaluatedProperties: false
        x-caudri:
          expansion:
            begin_sign:
              type: traffic_sign
              parameters: {sign: no_passing_begin}
            end_sign:
              type: traffic_sign
              parameters: {sign: no_passing_end}

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/zones/$defs/no_passing/$defs/validation
            type: object
            properties:
              dynamic_obstacle_count: {type: integer}
              post_zone_element_clearance:
                description: Element-free distance after the Zone end, not vehicle following distance.
                type: number
            additionalProperties: false

      # Expressway Zones are planar and mostly straight. Obstacles, stop lines,
      # and sharp turns are invalid; distinctive curves use guide signs.
      expressway:
        $ref: '#/$defs/zone_base'
        description: Directed expressway interval.
        required: [type, parameters]
        properties:
          type: {const: expressway}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            type: object
            properties:
              direction: {$ref: '#/$defs/direction'}
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
            additionalProperties: false
        unevaluatedProperties: false
        x-caudri:
          expansion:
            begin_sign:
              type: traffic_sign
              parameters: {sign: expressway_begin}
            end_sign:
              type: traffic_sign
              parameters: {sign: expressway_end}

        $defs:
          validation:
            $ref: regulations.yaml#/$defs/zones/$defs/expressway/$defs/validation
            type: object
            properties:
              length:
                description: Directed path length between the Zone start and end.
                type: number
                exclusiveMinimum: 0
              lane_count_per_direction: {type: integer}
            additionalProperties: false

      grade:
        $ref: '#/$defs/zone_base'
        description: Directed signed road-grade interval.
        required: [type, parameters]
        properties:
          type: {const: grade}
          parameters:
            oneOf:
              - {required: [range]}
              - {required: [span]}
            $ref: regulations.yaml#/$defs/zones/$defs/grade/$defs/parameters
            type: object
            required: [grade_percent]
            properties:
              grade_percent: {type: number}
              direction:
                $ref: '#/$defs/direction'
                description: Direction in which positive grade_percent climbs. With backward, positive grade descends
                  along increasing section distance.
              range: {$ref: '#/$defs/range'}
              span: {$ref: '#/$defs/span'}
              warning_sign_advance:
                description: Distance before the first non-zero grade in each sign's approach direction.
                type: number
                default: 1.0
            additionalProperties: false
        unevaluatedProperties: false
        x-caudri:
          expansion:
            positive_warning_sign:
              type: traffic_sign
              parameters: {sign: uphill_grade}
              parameters_from:
                displayed_value: {path: owner.parameters.grade_percent, transform: absolute}
            negative_warning_sign:
              type: traffic_sign
              parameters: {sign: downhill_grade}
              parameters_from:
                displayed_value: {path: owner.parameters.grade_percent, transform: absolute}

  # Actors — dynamic obstacles and pedestrians (WIP)
  actors:
    oneOf:
      - {$ref: '#/$defs/actors/$defs/dynamic_obstacle'}
      - {$ref: '#/$defs/actors/$defs/pedestrian'}

    $defs:
      dynamic_obstacle:
        $ref: '#/$defs/actor_base'
        description: Moving obstacle following the road network.
        required: [type, spawn, size]
        properties:
          type: {const: dynamic_obstacle}
          parameters:
            type: object
            properties:
              route:
                description: Directed path followed after `spawn`; omitted only when the simulator derives the designated
                  route.
                $ref: '#/$defs/span'
            additionalProperties: false
          size: {$ref: '#/$defs/obstacles/$defs/size', required: [length, width]}
          simulation: {$ref: '#/$defs/actors/$defs/dynamic_obstacle/$defs/simulation'}
        unevaluatedProperties: false

        $defs:
          simulation:
            $ref: regulations.yaml#/$defs/actors/$defs/dynamic_obstacle/$defs/simulation
            type: object
            properties:
              speed: {type: number, minimum: 0}
              behavior: {$ref: '#/$defs/actors/$defs/dynamic_obstacle/$defs/behavior'}
            additionalProperties: false

          behavior:
            type: object
            required: [type]
            properties:
              type: {const: follow_route}
              parameters:
                $ref: regulations.yaml#/$defs/actors/$defs/dynamic_obstacle/$defs/behaviors/$defs/follow_route/$defs/parameters
                type: object
                properties:
                  lane: {enum: [left, right]}
                  lane_changes: {type: boolean}
                  passing: {type: boolean}
                  stops:
                    type: array
                    items: {$ref: '#/$defs/actor_stop'}
                    default: []
                  intersection_exits:
                    description: Per-Intersection target-port overrides. Otherwise a Mandatory Turn applies, or travel
                      continues through the opposite port.
                    type: object
                    additionalProperties: {enum: [entry, left, straight, right]}
                    propertyNames: {$ref: '#/$defs/identifier'}
                    default: {}
                additionalProperties: false
                default: {}
            additionalProperties: false

      # If `spawn` is omitted, the actor starts in the center of the waiting area
      # selected by the traversal direction and faces across the road.
      pedestrian:
        $ref: '#/$defs/actor_base'
        description: Pedestrian associated with a crosswalk.
        required: [type, parameters, simulation]
        properties:
          type: {const: pedestrian}
          parameters:
            type: object
            required: [crosswalk]
            properties:
              crosswalk:
                description: Reference in the form `section_id.element_id`.
                type: string
                pattern: ^[a-z][a-z0-9_-]*\.[a-z][a-z0-9_-]*$
            additionalProperties: false

          rendering: {$ref: '#/$defs/actors/$defs/pedestrian/$defs/rendering'}
          simulation: {$ref: '#/$defs/actors/$defs/pedestrian/$defs/simulation'}
        unevaluatedProperties: false

        $defs:
          simulation:
            type: object
            required: [behavior]
            properties:
              speed: {type: number, exclusiveMinimum: 0}
              behavior: {$ref: '#/$defs/actors/$defs/pedestrian/$defs/behavior'}
            additionalProperties: false

          rendering:
            $ref: regulations.yaml#/$defs/actors/$defs/pedestrian/$defs/rendering
            type: object
            properties:
              asset: {type: string, default: actor/pedestrian.svg, format: uri-template}
              box_width: {type: number, default: 0.1}
              box_height: {type: number, default: 0.15}
              pictogram_width: {type: number, default: 0.075}
              pictogram_height: {type: number, default: 0.12}
              pictogram_stroke_width: {type: number, default: 0.015}
            additionalProperties: false

          validation:
            $ref: regulations.yaml#/$defs/actors/$defs/pedestrian/$defs/validation
            type: object
            properties:
              count_per_crosswalk:
                description: Maximum simultaneous Pedestrians referencing the same Crosswalk Element.
                type: integer
            additionalProperties: false

          behavior:
            type: object
            required: [type, parameters]
            properties:
              type: {const: crosswalk_traverse}
              parameters:
                $ref: regulations.yaml#/$defs/actors/$defs/pedestrian/$defs/behaviors/$defs/crosswalk_traverse/$defs/parameters
                type: object
                required: [direction]
                properties:
                  direction:
                    enum: [left_to_right, right_to_left]
                  trigger:
                    enum: [immediate, after_vehicle_stops]
                additionalProperties: false
            additionalProperties: false

  # Containers and open base schemas. Concrete types close their object fields.

  section_zones:
    type: object
    additionalProperties:
      $ref: '#/$defs/zones'
      properties:
        parameters:
          not: {required: [span]}
          required: [range]
    propertyNames: {$ref: '#/$defs/identifier'}
    default: {}

  root_zones:
    type: object
    additionalProperties:
      $ref: '#/$defs/zones'
      properties:
        parameters:
          not: {required: [range]}
          required: [span]
    propertyNames: {$ref: '#/$defs/identifier'}
    default: {}

  road_section_base:
    type: object
    required: [type]
    properties:
      type: {$ref: '#/$defs/identifier'}
      parameters:
        type: object
        default: {}
      road: {$ref: '#/$defs/road'}
      elements:
        type: object
        additionalProperties:
          oneOf:
            - {const: false}
            - {$ref: '#/$defs/elements'}
        propertyNames: {$ref: '#/$defs/identifier'}
        default: {}
      zones: {$ref: '#/$defs/section_zones'}
      features: {$ref: '#/$defs/feature_slots'}
      metadata: {$ref: '#/$defs/metadata'}

  road_element_base:
    type: object
    required: [type]
    properties:
      type: {$ref: '#/$defs/identifier'}
      parameters:
        type: object
        default: {}
      features:
        $ref: '#/$defs/feature_slots'
        additionalProperties:
          properties:
            at: {$ref: '#/$defs/local_position'}
      metadata: {$ref: '#/$defs/metadata'}

  zone_base:
    type: object
    required: [type]
    properties:
      type: {$ref: '#/$defs/identifier'}
      parameters:
        type: object
        default: {}
      features:
        $ref: '#/$defs/feature_slots'
        additionalProperties:
          properties:
            at: {$ref: '#/$defs/local_position'}
      metadata: {$ref: '#/$defs/metadata'}

  actor_base:
    type: object
    required: [type]
    properties:
      type: {$ref: '#/$defs/identifier'}
      spawn: {$ref: '#/$defs/actor_spawn'}
      size: {$ref: '#/$defs/size'}
      parameters:
        type: object
        default: {}
      metadata: {$ref: '#/$defs/metadata'}

  feature_base:
    type: object
    not: {required: [at, pose]}
    properties:
      type: {$ref: '#/$defs/identifier'}
      parameters:
        type: object
        default: {}
      at: {$ref: '#/$defs/position'}
      pose: {$ref: '#/$defs/pose'}

      size: {$ref: '#/$defs/size/$defs/patch'}
      metadata: {$ref: '#/$defs/metadata'}

  # Explicit root features and partial overrides of generated feature slots.
  root_feature:
    $ref: '#/$defs/features'
    oneOf:
      - {required: [at]}
      - {required: [pose]}
    properties:
      at: {required: [section]}

  feature_slots:
    type: object
    additionalProperties:
      oneOf:
        - {const: false}
        - {$ref: '#/$defs/features/$defs/patch'}
      properties:
        at:
          properties: {section: false}
    propertyNames: {$ref: '#/$defs/identifier'}
    default: {}

  discipline: {$ref: regulations.yaml#/$defs/discipline}
  disciplines:
    allOf:
      - if:
          required: [discipline]
          properties:
            discipline: {const: freedrive_course}
        then:
          properties:
            sections:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/section_rules'}
            features:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}
            zones:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/zone_rules'}
            actors:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/actor_rules'}
      - if:
          required: [discipline]
          properties:
            discipline: {const: obstacle_evasion_course}
        then:
          properties:
            sections:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/obstacle_evasion_course/$defs/section_rules'}
            features:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/obstacle_evasion_course/$defs/feature_rules'}
            zones:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/obstacle_evasion_course/$defs/zone_rules'}
            actors:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/obstacle_evasion_course/$defs/actor_rules'}
      - if:
          required: [discipline]
          properties:
            discipline: {const: navigation_course}
        then:
          properties:
            sections:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/navigation_course/$defs/section_rules'}
            features:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/navigation_course/$defs/feature_rules'}
            zones:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/navigation_course/$defs/zone_rules'}
            actors:
              additionalProperties: {$ref: '#/$defs/disciplines/$defs/navigation_course/$defs/actor_rules'}

    $defs:
      freedrive_course:
        $defs:
          feature_rules:
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow/properties/features}

          parking_spot_rules:
            properties:
              features:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}

          parking_lot_rules:
            properties:
              features:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}
              spots:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/parking_spot_rules'}

          element_rules:
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow/properties/elements}
              features:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}
              parameters:
                properties:
                  parallel_parking: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/parking_lot_rules'}
                  perpendicular_parking: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/parking_lot_rules'}

          zone_rules:
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow/properties/zones}
              features:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}

          intersection_rules:
            if:
              required: [type]
              properties:
                type: {const: intersection}
            then:
              properties:
                parameters:
                  properties:
                    layout: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow_variants/properties/sections.intersection}

          section_rules:
            $ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/intersection_rules'
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow/properties/sections}
              features:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/feature_rules'}
              elements:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/element_rules'}
              zones:
                additionalProperties: {$ref: '#/$defs/disciplines/$defs/freedrive_course/$defs/zone_rules'}

          actor_rules:
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/freedrive_course/$defs/allow/properties/actors}

      obstacle_evasion_course:
        $defs:
          feature_rules:
            properties:
              type: {$ref: regulations.yaml#/$defs/disciplines/$defs/obstacle_evasion_course/$defs/allow/properties/features}

