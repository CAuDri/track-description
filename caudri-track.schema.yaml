# CAuDri Track Description Schema v1.0
#
# This schema defines the general structure of a CAuDri track description file.
# It follows JSON Schema Draft 2020-12 and is designed to be fully YAML-compatible.
#
# This is the main schema file to be included in a track description.

$schema: https://json-schema.org/draft/2020-12/schema
$id: caudri-track.schema.yaml

title: CAuDri Track Description Schema v1.0

# CAuDri-specific metadata and conventions. "x-caudri" sections are not validated by JSON Schema, but can be used for validation and tooling.
x-caudri:
  version: "1.0"

  catalog: catalog.yaml
  regulations: regulations.yaml

  units:
    length: m
    time: s
    speed: m/s
    angle: deg
    curvature: 1/m
    grade: percent
  coordinates:
    # Geometry and explicit poses are always expressed in the Map frame.
    axes: {x: root_forward_tangent, y: left, z: upward}
    origin: root
    positive_yaw: ccw
    # Rendering/scenario placement applies p_world = Rz(map_orientation) * p_map + t_world.
    # World translation is supplied by the scenario; it is not track geometry.
    world_rotation: root.map_orientation

type: object

# Each track description references the main schema, which fixes the catalog and regulations.
# At least one road section must be defined as the root anchor of the track.
required: [$schema, id, root, sections]
properties:
  $schema:
    description: (Immutable) URL of caudri-track.schema.yaml or local file path.
    type: string
    format: uri-reference
  id: {$ref: catalog.yaml#/$defs/identifier}
  discipline: {$ref: catalog.yaml#/$defs/discipline}
  metadata: {$ref: catalog.yaml#/$defs/metadata}

  # Track-wide overrides of road properties.
  road: {$ref: catalog.yaml#/$defs/road}

  # A single section needs to be defined as the root (starting point) of the track.
  # It will implicitly define the map frame and origin of the track coordinate system.
  root: {$ref: catalog.yaml#/$defs/root}

  # The track is described as a directed graph of road sections (ie. straight sections, curves or intersections).
  # Sections are connected by "ports" with each type of section having at least one entry and one or more exit ports.
  sections:
    type: object
    additionalProperties: {$ref: catalog.yaml#/$defs/sections}
    propertyNames: {$ref: catalog.yaml#/$defs/identifier}
    minProperties: 1

  # Connections between sections need to be defined explicitly using port references.
  # Each connection is described as a pair of port references, the first being the source port and the second the target port.
  # Example: "section1" -> "section2" is represented as ["section1.exit", "section2.entry"].
  # Ports can only be referenced once, two entry ports cannot be connected together.
  # This allows for an arbitrary track topology, including loops and branches, with an implicit direction of travel.
  connections:
    type: array
    items: {$ref: catalog.yaml#/$defs/connection}
    default: []

  # Zones can span multiple sections and ca be defined with section-local start and end points.
  # Examples are speed-limit zones or missing lane markings. Zones can overlap.
  # The path between start and end points follows the directed section graph using the main/mandatory exit direction at intersections.
  # A valid path is not guaranteed to exist. A zone can also be nested in a section using "range", a root zone uses "span".
  zones: {$ref: catalog.yaml#/$defs/root_zones}

  # Features such as traffic signs, obstacles, etc. can be defined section- or element-local, or as a root feature with a global scope.
  features:
    type: object
    additionalProperties: {$ref: catalog.yaml#/$defs/root_feature}
    propertyNames: {$ref: catalog.yaml#/$defs/identifier}
    default: {}

  # Moving objects with an explicit start and end position. (WIP)
  actors:
    type: object
    additionalProperties: {$ref: catalog.yaml#/$defs/actors}
    propertyNames: {$ref: catalog.yaml#/$defs/identifier}
    default: {}

  # Global renderer settings; validation configuration stays in the catalog/regulations.
  rendering: {$ref: catalog.yaml#/$defs/global/$defs/rendering}

# Apply the selected discipline's restrictions.
$ref: catalog.yaml#/$defs/disciplines
additionalProperties: false
