  <title id="title">Straight with two staggered barred areas</title>
  <desc id="description">A 5 m straight section with a left barred area from 0.58 to 2.02 m and a right barred area from 2.98 to 4.42 m in the nominal direction. Orange entry and blue exit arrows point to the right. The road extends 4 cm beyond the outer markings and ends flush at the ports.</desc>
