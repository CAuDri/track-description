  <title id="title">Section types and their ports</title>
  <desc id="description">A 2.64 m straight above a 60 degree arc with radius 2.4 m on the left. Intersection on the right, displayed at 135 percent of the scale of the other sections. Orange entry ports and blue outgoing ports. Transparent background.</desc>
