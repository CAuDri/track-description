      <path d="M 456.50000 80.40000 L 499.50000 80.40000" fill="none" stroke="#1673B8" stroke-width="4" stroke-linecap="butt" />
      <polygon points="513.50000,80.40000 499.50000,86.40000 499.50000,74.40000" fill="#1673B8" />
      <circle cx="456.50000" cy="80.40000" r="9" fill="#1673B8" stroke="#1673B8" stroke-width="2.25" />
      <text x="476.50000" y="59.40000" fill="#1673B8" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="start">exit</text>
