<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 511 161" width="511" height="161" role="img" aria-labelledby="title description" data-meters-to-pixels="120">
  <title id="title">2.64 m straight section ports</title>
