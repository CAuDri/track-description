# CAuDri Track Regulations Profile
#
# This is a machine-readable version of the CAuDri-Challenge regulations. 
# It contains limits and constraints for the track layout and simulation. 

$schema: https://json-schema.org/draft/2020-12/schema
$id: regulations.yaml

title: CAuDri Regulations / 2026-05-06
x-caudri:
  version: "1.0"
  ruleset: '2026-05-06'

  # Physical fabrication tolerance for dimensions and angles in appendix figures,
  # unless the figure states otherwise. Not applied to ideal Track Description validation.
  figure_tolerance: 0.05

$defs:
  global:
    $defs:
      validation:
        properties:
          root_port: {const: exit}     # To be able to place a start box
          connected_network: {const: true}    # Road must be closed for the competition

  # Shared dimensions for static and dynamic obstacles, not other objects.
  obstacles:
    $defs:
      size:
        properties:
          width: {minimum: 0.1, maximum: 0.4}
          height: {minimum: 0.1, maximum: 0.24}
          length: {minimum: 0.1}

  road:
    $defs:
      parameters:
        properties:
          lane_width: {minimum: 0.35, maximum: 0.45}
          marking_width: {minimum: 0.018, maximum: 0.02}
          centerline: {enum: [dashed, double_solid, mixed]}
          left_boundary: {const: solid}
          right_boundary: {const: solid}

      rendering:
        properties:
          marking_color: {const: '#FFFFFF'}
          centerline_dashed_stroke_length: {const: 0.2}
          centerline_dashed_gap_length: {const: 0.2}
          centerline_double_total_width: {minimum: 0.056, maximum: 0.06}

      validation:
        properties:
          lane_count: {const: 2}
          lanes_per_direction: {const: 1}
          road_element_spacing: {minimum: 1.0}
          neighboring_road_spacing: {minimum: 0.05}
          artifact_marking_spacing: {minimum: 0.1}
          obstacle_spacing: {minimum: 1.0}
          marking_type_minimum_length: {minimum: 1.0}

  sections:
    $defs:
      arc:
        $defs:
          validation:
            properties:
              # The regulations only specify a minimum inner radius for curved sections
              # Other specified radii will normally be measured from the reference (center) line
              inner_radius: {minimum: 1.0}

      intersection:
        $defs:
          parameters:
            properties:
              layout: {enum: [stop, give_way, priority_to_right]}
              ports: {minItems: 2, maxItems: 3} # Number of exit ports
              angle: {minimum: 70, maximum: 110}
              priority_sign_distance: {minimum: 0.3, maximum: 0.5}
              mandatory_sign_distance: {minimum: 0.15, maximum: 0.25}
              mandatory_marking_distance: {minimum: 0.05, maximum: 0.25}

          validation:
            properties:
              dynamic_obstacle_count: {maximum: 1}
            $defs:
              # Controlled ports are those with a stop or give-way line where the vehicle must yield
              stop:
                properties:
                  controlled_port_count: {minimum: 1, maximum: 2}
              give_way:
                properties:
                  controlled_port_count: {minimum: 1, maximum: 2}

          simulation:
            properties:
              # Nominal extent of the priority area in appendix A.4.6, relative to
              # the theoretical stop line on the obstacle's approach lane.
              priority_obstacle_distance_before_stop_line: {const: 0.25}
              priority_obstacle_distance_after_stop_line: {const: 0.2}

  # Road elements: start area, lines, crosswalks, junctions and parking.
  elements:
    $defs:
      start_box:
        $defs:
          parameters:
            properties:
              # Gap between QR-code and stop sign
              horizontal_gap: {minimum: 0.05}
              # Height of the lower edge of the stop sign above the road surface
              lower_edge_height: {minimum: 0.1, maximum: 0.2}

          rendering:
            properties:
              stop_panel_width: {const: 0.15}
              stop_panel_height: {const: 0.15}
              stop_qr_width: {const: 0.15}
              stop_qr_height: {const: 0.15}
              qr_payload: {const: STOP}
              qr_version: {const: 1}
              qr_error_correction: {const: H}
              qr_mode: {const: alphanumeric}
              qr_mask_pattern: {const: 5}

          validation:
            properties:
              # A start box can only really be placed at the exit port of a left arc section, so we will validate that.
              root_section_type: {const: arc}
              root_section_direction: {const: left}

          simulation:
            properties:
              gate_open_duration: {const: 30}

      starting_line:
        $defs:
          parameters:
            properties:
              pattern: {enum: [checkered, solid]}

          validation:
            properties:
              # Only tracks with a single starting line are valid competition tracks.
              maximum_count: {const: 1}
              root_only: {const: true}
              trailing_edge_at_root_exit: {const: true}

      crosswalk:
        $defs:
          parameters:
            properties:
              sign_distance: {minimum: 0.3, maximum: 0.5}
              # Waiting areas for pedestrians are always placed on both sides of the crosswalk, this can be overridden.
              waiting_area_sides: {const: [left, right]}
              waiting_area_lateral_extent: {const: 0.2}
              waiting_area_longitudinal_extent: {const: 0.45}

          rendering:
            properties:
              stripe_width: {minimum: 0.036, maximum: 0.04}
              stripe_length: {const: 0.4}
              stripe_gap: {const: 0.04}

      barred_area:
        $defs:
          parameters:
            properties:
              outline_side_angle: {const: 60.0}
              priority_sign_distance: {minimum: 0.3, maximum: 0.5}

          rendering:
            properties:
              outline_width: {minimum: 0.018, maximum: 0.02}
              hatch_angle: {const: 27.0}
              hatch_width: {minimum: 0.036, maximum: 0.04}
              # Measured on the outside track boundary along the direction of travel
              hatch_longitudinal_gap: {const: 0.15}

          validation:
            properties:
              length: {maximum: 2}
              blocked_lane_count: {const: 1}
              dynamic_obstacle_count: {maximum: 1}

      side_road_junction:
        $defs:
          rendering:
            properties:
              stroke_length: {const: 0.1}
              gap_length: {const: 0.05}

          validation:
            properties:
              length: {maximum: 0.96}

      parking_area:
        $defs:
          # Parking areas are straight and planar with a dashed centerline.
          # Missing markings and static obstacles in their driving lanes are invalid.
          # Parallel spot lengths increase in approach order. Gaps below 0.40 m are not considered valid spots.
          parameters:
            properties:
              announcement_sign_distance: {minimum: 0.3, maximum: 0.5}
              boundary_side_angle: {minimum: 45, maximum: 60}

          rendering:
            properties:
              parallel_outer_marking_width: {minimum: 0.018, maximum: 0.02}
              perpendicular_separator_width: {minimum: 0.018, maximum: 0.02}
              boundary_outline_width: {minimum: 0.018, maximum: 0.02}

          validation:
            properties:
              parallel_spot_count: {minimum: 1}
              parallel_final_spot_length: {minimum: 0.7}
              parallel_obstacle_lateral_gap: {minimum: 0.02, maximum: 0.2}
              parallel_invalid_gap_below: {const: 0.4}
              parallel_side: {const: right}
              perpendicular_spot_count: {minimum: 1}
              perpendicular_obstacle_lateral_gap: {minimum: 0.02, maximum: 0.1}
              perpendicular_side: {const: left}
              centerline: {const: dashed}

          parallel_spot:
            properties:
              extent_lateral: {const: 0.3}

          perpendicular_spot:
            properties:
              extent_along_road: {const: 0.35}
              extent_lateral: {const: 0.5}

  # Features — supported signs, marking variants and landmarks.
  features:
    $defs:
      traffic_sign:
        $defs:
          parameters:
            allOf:
              - if:
                  required: [sign]
                  properties:
                    sign: {enum: [speed_limit_begin, speed_limit_end]}
                then:
                  # For speed limit signs, the displayed value can be defined as a parameter (in steps of 10 km/h)
                  properties:
                    displayed_value: {$ref: '#/$defs/zones/$defs/speed_limit/$defs/parameters/properties/value_kmh'}
              - if:
                  required: [sign]
                  properties:
                    sign: {enum: [uphill_grade, downhill_grade]}
                then:
                  # Same thing for grade signs in 1% steps, the sign itself indicates the direction of the grade (uphill or downhill)
                  properties:
                    displayed_value:
                      $ref: '#/$defs/zones/$defs/grade/$defs/parameters/properties/grade_percent'
                      minimum: 0
            # Other signs don't require any additional parameters
            properties:
              sign:
                enum:
                  - stop
                  - give_way
                  - priority_road
                  - mandatory_left
                  - mandatory_right
                  - crosswalk
                  - parking_zone
                  - oncoming_traffic_priority
                  - speed_limit_begin
                  - speed_limit_end
                  - no_passing_begin
                  - no_passing_end
                  - expressway_begin
                  - expressway_end
                  - uphill_grade
                  - downhill_grade
                  - guide_left
                  - guide_right
                  - guide_left_multiple
                  - guide_right_multiple
              lateral_offset: {minimum: 0.075, maximum: 0.125}
              lower_edge_height: {const: 0.15}

          rendering:
            properties:
              standard_width: {const: 0.15}
              standard_height: {const: 0.15}
              round_diameter: {const: 0.1}
              # A.2: axis-aligned bounding sizes, including the diamond's diagonal.
              priority_width: {const: 0.1}
              priority_height: {const: 0.1}
              guide_width: {const: 0.1}
              guide_height: {const: 0.1}
              guide_multiple_width: {const: 0.3}
              guide_multiple_height: {const: 0.1}

          validation:
            properties:
              guide_curve_inner_radius: {exclusiveMaximum: 1.2}
              guide_preceding_straight_length: {minimum: 3.0}
              speed_limit_separated_sign_spacing: {minimum: 0.5}

      surface_marking:
        $defs:
          parameters:
            if:
              required: [marking]
              properties:
                marking:
                  enum: [speed_limit_begin, speed_limit_end]
            then:
              properties:
                displayed_value: {$ref: '#/$defs/zones/$defs/speed_limit/$defs/parameters/properties/value_kmh'}
            properties:
              marking:
                enum:
                  - stop_line
                  - give_way_line
                  - speed_limit_begin
                  - speed_limit_end
                  - mandatory_direction

          rendering:
            $defs:
              stop_line:
                properties:
                  width: {minimum: 0.036, maximum: 0.04}

              give_way_line:
                properties:
                  stroke_length: {const: 0.08}
                  gap_length: {const: 0.06}
                  width: {minimum: 0.036, maximum: 0.04}

              speed_limit_begin:
                properties:
                  digit_width: {const: 0.06}
                  digit_height: {const: 0.4}
                  total_width: {const: 0.15}

              speed_limit_end:
                properties:
                  total_width: {const: 0.2}
                  total_height: {const: 0.5}

              mandatory_direction:
                properties:
                  width: {const: 0.07}
                  length: {const: 0.5}

      landmark:
        $defs:
          parameters:
            properties:
              identifier: {minimum: 0, maximum: 9}
              sign_sides: {const: [left, right]}
              faces:
                properties:
                  left: {const: backward}
                  right: {const: forward}

          rendering:
            properties:
              sign_shape: {const: square}
              sign_width: {const: 0.15}
              sign_height: {const: 0.15}
              qr_version: {const: 1}
              qr_error_correction: {const: H}
              qr_profiles:
                # Constrain supplied leaves so a track can override one subfield.
                # Unspecified profiles/members inherit their catalog/rule values.
                properties:
                  '0': {properties: {mode: {const: numeric}, mask_pattern: {const: 3}}}
                  '1': {properties: {mode: {const: byte}, mask_pattern: {const: 4}}}
                  '2': {properties: {mode: {const: byte}, mask_pattern: {const: 4}}}
                  '3': {properties: {mode: {const: byte}, mask_pattern: {const: 3}}}
                  '4': {properties: {mode: {const: byte}, mask_pattern: {const: 3}}}
                  '5': {properties: {mode: {const: byte}, mask_pattern: {const: 4}}}
                  '6': {properties: {mode: {const: byte}, mask_pattern: {const: 4}}}
                  '7': {properties: {mode: {const: byte}, mask_pattern: {const: 0}}}
                  '8': {properties: {mode: {const: byte}, mask_pattern: {const: 7}}}
                  '9': {properties: {mode: {const: byte}, mask_pattern: {const: 5}}}
                additionalProperties: false

        # Supplied QR content must match the navigation identifier. Omission keeps the derived default.
        # Partial overrides without an identifier may use any legal payload; recheck after inheritance.
        anyOf:
          - properties: {parameters: {properties: {identifier: {const: 0}}}, rendering: {properties: {qr_payload: {const: '0'}}}}
          - properties: {parameters: {properties: {identifier: {const: 1}}}, rendering: {properties: {qr_payload: {const: '1'}}}}
          - properties: {parameters: {properties: {identifier: {const: 2}}}, rendering: {properties: {qr_payload: {const: '2'}}}}
          - properties: {parameters: {properties: {identifier: {const: 3}}}, rendering: {properties: {qr_payload: {const: '3'}}}}
          - properties: {parameters: {properties: {identifier: {const: 4}}}, rendering: {properties: {qr_payload: {const: '4'}}}}
          - properties: {parameters: {properties: {identifier: {const: 5}}}, rendering: {properties: {qr_payload: {const: '5'}}}}
          - properties: {parameters: {properties: {identifier: {const: 6}}}, rendering: {properties: {qr_payload: {const: '6'}}}}
          - properties: {parameters: {properties: {identifier: {const: 7}}}, rendering: {properties: {qr_payload: {const: '7'}}}}
          - properties: {parameters: {properties: {identifier: {const: 8}}}, rendering: {properties: {qr_payload: {const: '8'}}}}
          - properties: {parameters: {properties: {identifier: {const: 9}}}, rendering: {properties: {qr_payload: {const: '9'}}}}

  zones:
    $defs:
      centerline:
        $defs:
          parameters:
            properties:
              style: {enum: [dashed, double_solid, mixed]}

      missing_marking:
        $defs:
          validation:
            properties:
              length: {maximum: 1} # One continuous gap, including gaps across section boundaries.
              simultaneous_count_outside_intersections: {maximum: 2}

      speed_limit:
        $defs:
          parameters:
            properties:
              value_kmh: {type: integer, exclusiveMinimum: 0, multipleOf: 10}

          simulation:
            properties:
              displayed_to_vehicle_speed_scale: {const: 0.1}

      no_passing:
        $defs:
          # Static obstacles may not be present in the no passing zone. The effective centerline is
          # solid on the protected driving side, a passing maneuver started before the zone may finish.
          parameters:
            properties:
              centerline: {enum: [double_solid, mixed]}

          validation:
            properties:
              dynamic_obstacle_count: {maximum: 1}
              post_zone_element_clearance: {minimum: 2}

      expressway:
        $defs:
          # Expressway Zones have right of way and contain no obstacles or stop lines.
          validation:
            properties:
              length: {minimum: 5}

      grade:
        $defs:
          # Road Elements are invalid on grades.
          parameters:
            properties:
              grade_percent: {minimum: -10, maximum: 10}
              warning_sign_advance: {minimum: 1.0}

  actors:
    $defs:
      dynamic_obstacle:
        $defs:
          # A dynamic obstacle may stop temporarily. At intersections it approaches
          # from another direction and follows the applicable right-of-way rules.
          simulation:
            properties:
              speed: {maximum: 0.6}

          behaviors:
            $defs:
              follow_route:
                $defs:
                  parameters:
                    properties:
                      lane: {const: right}
                      lane_changes: {const: false}
                      passing: {const: false}

      pedestrian:
        $defs:
          behaviors:
            $defs:
              crosswalk_traverse:
                $defs:
                  parameters:
                    properties:
                      trigger: {const: after_vehicle_stops}

          rendering:
            properties:
              box_width: {const: 0.1}
              box_height: {const: 0.15}
              pictogram_width: {const: 0.075}
              pictogram_height: {const: 0.12}
              pictogram_stroke_width: {const: 0.015}

          validation:
            properties:
              count_per_crosswalk: {maximum: 1}

  # A designated route starts at the starting line, follows mandatory turns and
  # returns to the starting line. This shared meaning is enforced by the graph validator.
  # Disciplines: allowed types, simulator settings and counts of derived objects.
  discipline: {type: string, enum: [freedrive_course, obstacle_evasion_course, navigation_course]}

  disciplines:
    $defs:
      # The vehicle takes the straight exit at intersections and may ignore traffic
      # priority, stop, give-way, and mandatory-direction instructions. No parking
      # maneuver is required and no dynamic obstacle is present.
      freedrive_course:
        x-caudri:
          course:
            closure: required
            designated_route: {requirement: required}

        $defs:
          allow:
            properties:
              sections: {enum: [straight, arc, clothoid, intersection]}
              elements: {enum: [start_box, starting_line, side_road_junction, parking_area]}
              features: {enum: [traffic_sign, surface_marking, artifact]}
              zones: {enum: [centerline, missing_marking, no_passing, expressway, speed_limit, grade]}
              actors: false

          allow_variants:
            properties:
              sections.intersection: {enum: [stop, give_way, priority_to_right]}

          simulation:
            type: object
            properties:
              duration: {const: 120}
            additionalProperties: false

          counts:
            type: object
            properties: {}
            additionalProperties: false

      # Traffic signs and mandatory directions apply. The vehicle stops for at
      # least 3 s at stop lines and 1 s at give-way lines, no farther than 0.15 m
      # before the line. Passing is invalid at Intersections, No-passing Zones,
      # Barred Areas, and Crosswalks.
      obstacle_evasion_course:
        x-caudri:
          course:
            closure: required
            designated_route: {requirement: required}

        $defs:
          allow:
            properties:
              sections: {enum: [straight, arc, clothoid, intersection]}
              elements: {enum: [start_box, starting_line, crosswalk, barred_area, side_road_junction, parking_area]}
              features: {enum: [traffic_sign, surface_marking, static_obstacle, artifact]}
              zones: {enum: [centerline, missing_marking, no_passing, expressway, speed_limit, grade]}
              actors: {enum: [dynamic_obstacle, pedestrian]}

          allow_variants:
            properties:
              sections.intersection: {enum: [stop, give_way, priority_to_right]}

          simulation:
            type: object
            properties:
              duration: {const: 300}
              laps: {const: 3}
              parking_attempts_per_lap: {maximum: 1}
              obstacle_return_to_right_lane_distance: {maximum: 2.0}
              stop_line_duration: {minimum: 3.0}
              give_way_line_duration: {minimum: 1.0}
              controlled_line_stop_distance: {maximum: 0.15}
              no_passing_dynamic_obstacle_distance: {minimum: 0.3}
              barred_area_return_to_right_lane_distance: {maximum: 2.0}
              barred_area_oncoming_obstacle_distance: {minimum: 0.5}
              crosswalk_stop_duration: {minimum: 3.0}
              crosswalk_stop_distance: {maximum: 0.15}
            additionalProperties: false

          counts:
            type: object
            properties:
              features.static_obstacle: {minimum: 1}
              actors.dynamic_obstacle: {minimum: 1}
            additionalProperties: false

      # The layout is not announced before the event. Landmarks are visited in
      # ascending identifier order and may be passed in either direction. Regular
      # traffic signs and mandatory directions may be ignored; layout and Landmark
      # placement remain unchanged between navigation phases. The physical road
      # network remains closed; only the designated route is optional.
      navigation_course:
        x-caudri:
          course:
            closure: required
            designated_route: {requirement: optional}

        $defs:
          allow:
            properties:
              sections: {enum: [straight, arc, clothoid, intersection]}
              elements: {enum: [start_box, starting_line, crosswalk, barred_area, side_road_junction, parking_area]}
              features: {enum: [traffic_sign, surface_marking, landmark, artifact]}
              zones: {enum: [centerline, missing_marking, no_passing, expressway, speed_limit, grade]}
              actors: false

          allow_variants:
            properties:
              sections.intersection: {enum: [stop, give_way, priority_to_right]}

          simulation:
            type: object
            properties:
              mapping_duration: {const: 180}
              navigation_duration: {const: 180}
            additionalProperties: false

          counts:
            type: object
            properties:
              features.landmark: {minimum: 1, maximum: 10}
            additionalProperties: false
